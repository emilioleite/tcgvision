name: Deploy TCG Vision to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Prepare CollectorVision runtime
        run: bash scripts/prepare-collectorvision.sh

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js camera-lifecycle-ui.js manifest.webmanifest icon.svg sw.js _site/
          cp -R collectorvision _site/collectorvision

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
