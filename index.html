<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="description" content="TCG Vision — teste de reconhecimento de cartas de Magic pela câmera do celular.">
  <title>TCG Vision</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MVP</p>
        <h1>TCG Vision</h1>
      </div>
      <span class="badge">Magic</span>
    </header>

    <section class="scanner-card" aria-label="Scanner de carta">
      <div id="scanner-wrap" class="scanner-wrap">
        <div id="scanner" class="scanner"></div>
        <div class="guide" aria-hidden="true">
          <span>Posicione a carta aqui</span>
        </div>
      </div>

      <button id="camera-button" class="camera-button" type="button">
        Iniciar câmera
      </button>

      <p id="status" class="status" role="status" aria-live="polite">
        Toque em “Iniciar câmera” para começar.
      </p>
    </section>

    <section id="result" class="result-card" hidden aria-live="polite">
      <p class="result-label">Carta reconhecida</p>
      <h2 id="card-name">—</h2>
      <p id="card-set" class="card-set"></p>
      <div class="confidence-row">
        <span>Confiança</span>
        <strong id="card-confidence">—</strong>
      </div>
    </section>

    <p class="hint">
      Para o primeiro teste, segure a carta inteira e parada diante da câmera até o contorno ficar estável.
    </p>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
